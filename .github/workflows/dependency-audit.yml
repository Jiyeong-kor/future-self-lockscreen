name: Dependency Audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Validate lockfile without install scripts
        run: npm ci --ignore-scripts
      - name: Audit all npm dependencies
        env:
          AUDIT_REPORT_DIR: ${{ runner.temp }}/future-self-audit
        run: node scripts/ci/audit-policy.cjs
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/future-self-audit/
          retention-days: 7
          if-no-files-found: warn
