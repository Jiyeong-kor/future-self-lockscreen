name: Dependency Audit

on:
  push:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
      - docs/DEPENDENCY_SECURITY.md
  pull_request:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Explain current audit policy
        run: |
          echo "Known upstream findings are tracked in docs/DEPENDENCY_SECURITY.md."
          echo "A supported direct-dependency fix must be applied before public release."
