name: Refresh npm lockfile

on:
  push:
    paths:
      - .github/workflows/refresh-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove one-shot workflow
        run: git rm --ignore-unmatch .github/workflows/refresh-lockfile.yml

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore: dependency 정리 lockfile 갱신"
          git push origin HEAD:main
